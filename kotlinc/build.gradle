import org.gradle.api.tasks.*
import org.objectweb.asm.*
import org.objectweb.asm.commons.*
import java.util.jar.*
import java.util.zip.*

buildscript {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url 'https://repo.jenkins-ci.org/public/' }
        maven { url 'https://repo.gradle.org/gradle/libs-releases' }

        mavenLocal()
    }
    dependencies {
        classpath "org.ow2.asm:asm:9.8"
        classpath "org.ow2.asm:asm-commons:9.8"
        classpath "org.ow2.asm:asm-tree:9.8"
        classpath "com.google.googlejavaformat:google-java-format:1.27.0"
    }
}

plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
    id 'com.diffplug.spotless' version '7.0.3'
    id 'org.jlleitschuh.gradle.ktlint' version '12.1.0'   
    id 'com.github.johnrengelman.shadow' version '8.1.1' 
    id 'maven-publish'       
}

repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
    maven { url "https://jitpack.io" } 
	maven { url "https://plugins.gradle.org/m2/" } 
    maven { url 'https://repo.jenkins-ci.org/public/' }
    maven { url 'https://repo.gradle.org/gradle/libs-releases' }
    maven { url 'https://releases.usethesource.io/maven/' }
    maven { url "https://maven.pkg.jetbrains.space/kotlin/p/kotlin/kotlin-dependencies" }
    maven { url "https://packages.jetbrains.team/maven/p/ij/intellij-dependencies/" }
    mavenLocal()
}


spotless {
    java {
        target "**/*.java"		  
        googleJavaFormat()
    }
} 

apply plugin: RemapingPlugin

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
    kotlinOptions {
        jvmTarget = "17"
    }
}
tasks.shadowJar.dependsOn tasks.remap
tasks.assemble.dependsOn tasks.shadowJar
tasks.build.dependsOn tasks.shadowJar

shadowJar {  
    exclude 'META-INF/maven/org.jetbrains/*/pom.xml'
    exclude 'META-INF/maven/org.jetbrains/*/pom.properties'
    exclude 'kotlin/**'
    exclude '**/*org/jetbrains/annotations/Nls*'
    exclude 'com/google/**'
    exclude 'org/codehaus/**'

    relocate 'java.lang.management', 'stub.management'
    relocate 'javax.management', 'stub.management.javax'

    dependencies {
        exclude(dependency("org.jetbrains:annotations:23.0.0"))
        exclude(dependency("org.jetbrains.kotlin:kotlin-reflect:1.6.10"))
        exclude(dependency("org.jetbrains.kotlin:kotlin-stdlib:2.2.0"))
        exclude(dependency("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0"))
        exclude(dependency("org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.0"))
        exclude(dependency("org.jetbrains.kotlin:kotlin-stdlib-common:2.2.0"))
        exclude(dependency("org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.8.0"))
        exclude(dependency("org.jetbrains.kotlin:kotlin-script-runtime:2.2.0"))
     }
	
    archiveFileName.set("kotlinc.jar")
    archiveClassifier.set("")
    archiveVersion.set("")
    destinationDirectory.set(file("$rootDir/build/libs"))
	
}

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-compiler:2.2.0")
    implementation("org.jetbrains.intellij.deps:trove4j:1.0.20200330")
}

publishing {
    publications {
        shadow(MavenPublication) {
            groupId = 'com.github.CilicaLab'
            artifactId = project.name
            version = '2.2.1'
            artifact(tasks.shadowJar) {
                builtBy tasks.shadowJar
            }
        }
    }
}


class RemapingPlugin implements Plugin<Project> {
    void apply(Project target) {
        target.tasks.register("remap", RemapingTask) {
            it.dependsOn target.tasks.named("jar")
        }

        target.tasks.assemble.dependsOn target.tasks.named("remap")
        target.tasks.build.dependsOn target.tasks.named("remap")
    }
}

abstract class RemapingTask extends DefaultTask {

    @InputFile
    final RegularFileProperty inputJar = project.objects.fileProperty()

    @OutputFile
    final RegularFileProperty outputJar = project.objects.fileProperty()

    RemapingTask() {
        inputJar.set(project.tasks.named("jar").flatMap { it.archiveFile })
        outputJar.set(new File(project.buildDir, "libs/${project.name}.jar"))
    }

    @TaskAction
    void remap() {
        File originalJar = inputJar.get().asFile
        File outputJarFile = outputJar.get().asFile
        File tempJar = new File(project.buildDir, "tmp/libs/${project.name}.jar")

        tempJar.parentFile.mkdirs()
        outputJarFile.parentFile.mkdirs()

        tempJar.delete()
        tempJar << originalJar.bytes

        def remapper = new Remapper() {
            @Override
            String map(String name) {                
                if (name.startsWith("com/intellij")) return name.replaceFirst("^com/intellij", "org/jetbrains/kotlin/com/intellij")
                if (name.startsWith("java/lang/management")) return "stub/management/" + name.substring("java/lang/management/".length())
                if (name.startsWith("javax/management")) return "stub/management/javax/" + name.substring("javax/management/".length())
                return name
            }
        }

        try (
            JarFile jar = new JarFile(tempJar)
            ZipOutputStream out = new ZipOutputStream(new FileOutputStream(outputJarFile))
        ) {
            Enumeration<JarEntry> entries = jar.entries()
            while (entries.hasMoreElements()) {
                JarEntry entry = entries.nextElement()
                InputStream entryStream = jar.getInputStream(entry)

                if (entry.getName().endsWith(".class")) {
                    ClassReader reader = new ClassReader(entryStream)
                    ClassWriter writer = new ClassWriter(ClassWriter.COMPUTE_FRAMES) {
                        @Override
                        protected String getCommonSuperClass(String type1, String type2) {
                            try {
                                return super.getCommonSuperClass(type1, type2)
                            } catch (Throwable t) {
                                return "java/lang/Object"
                            }
                        }
                    }
                    ClassRemapper remapperVisitor = new ClassRemapper(writer, remapper)
                    reader.accept(remapperVisitor, ClassReader.EXPAND_FRAMES)
                    byte[] remappedBytes = writer.toByteArray()
                    String newName = remapper.map(entry.getName())
                    out.putNextEntry(new ZipEntry(newName))
                    out.write(remappedBytes)
                } else {
                    out.putNextEntry(new ZipEntry(entry.getName()))
                    out.write(entryStream.readAllBytes())
                }
                out.closeEntry()
                entryStream.close()
            }
        }
    }
}

tasks.register("postProcessKotlincJar") {
    dependsOn tasks.shadowJar
    mustRunAfter tasks.shadowJar

    doLast {
        File jarFile = file("$rootDir/build/libs/kotlinc.jar")
        File tempFile = file("$rootDir/build/tmp/libs/kotlinc-postprocess.jar")
        tempFile.parentFile.mkdirs()
        tempFile.delete()

        try (
            JarFile jar = new JarFile(jarFile)
            ZipOutputStream out = new ZipOutputStream(new FileOutputStream(tempFile))
        ) {
            Set<String> existingEntries = []
            Enumeration<JarEntry> entries = jar.entries()
            while (entries.hasMoreElements()) {
                JarEntry entry = entries.nextElement()
                existingEntries << entry.getName()
            }

            entries = jar.entries()
            while (entries.hasMoreElements()) {
                JarEntry entry = entries.nextElement()
                InputStream entryStream = jar.getInputStream(entry)
                byte[] bytes = entryStream.readAllBytes()
                entryStream.close()

                ZipEntry newEntry = new ZipEntry(entry.getName())
                out.putNextEntry(newEntry)
                out.write(bytes)
                out.closeEntry()

                if (entry.getName().endsWith(".class")) {
                    String clazzName = entry.getName().substring(0, entry.getName().length() - 6) + ".clazz"
                    if (!existingEntries.contains(clazzName)) {
                        ZipEntry clazzEntry = new ZipEntry(clazzName)
                        out.putNextEntry(clazzEntry)
                        out.closeEntry()
                        existingEntries << clazzName
                    }
                }
            }
        }

        jarFile.delete()
        tempFile.renameTo(jarFile)
    }
}

tasks.register("verifyClazzEntries") {
    dependsOn tasks.postProcessKotlincJar

    doLast {
        File jarFile = file("$rootDir/build/libs/kotlinc.jar")
        JarFile jar = new JarFile(jarFile)
        Set<String> entries = []
        Enumeration<JarEntry> e = jar.entries()
        while (e.hasMoreElements()) {
            entries << e.nextElement().getName()
        }
        jar.close()

        List<String> requiredClazzes = [
            "org/jetbrains/kotlin/cli/common/CompilerSystemProperties.clazz",
            "org/jetbrains/kotlin/cli/jvm/compiler/KotlinCoreEnvironment\$Companion.clazz",
            "org/jetbrains/kotlin/utils/PathUtil.clazz"
        ]

        List<String> missing = []
        requiredClazzes.each { clazz ->
            if (!entries.contains(clazz)) {
                missing << clazz
            }
        }

        if (!missing.isEmpty()) {
            throw new GradleException("Verification failed! Missing required .clazz entries in final jar: ${missing}")
        }
        println "VERIFICATION SUCCESS: All required .clazz entries (including CompilerSystemProperties.clazz) are present in final jar!"
    }
}

tasks.register("verifyNoJavaManagement") {
    dependsOn tasks.postProcessKotlincJar

    doLast {
        File jarFile = file("$rootDir/build/libs/kotlinc.jar")
        JarFile jar = new JarFile(jarFile)
        List<String> violations = []
        Enumeration<JarEntry> entries = jar.entries()
        while (entries.hasMoreElements()) {
            JarEntry entry = entries.nextElement()
            if (entry.getName().endsWith(".class") || entry.getName().endsWith(".clazz")) {
                byte[] bytes = jar.getInputStream(entry).readAllBytes()
                String content = new String(bytes, "ISO-8859-1")
                if (content.contains("java/lang/management") || content.contains("java.lang.management")) {
                    violations << entry.getName()
                }
            }
        }
        jar.close()

        if (!violations.isEmpty()) {
            throw new GradleException("Verification failed! Unrelocated java/lang/management references found in ${violations.size()} entries: ${violations}")
        }
        println "VERIFICATION SUCCESS: No java/lang/management references remain in the final jar!"
    }
}

tasks.register("scanDesktopApis") {
    doLast {
        File jarFile = file("$rootDir/build/libs/kotlinc.jar")
        JarFile jar = new JarFile(jarFile)
        def patterns = [
            "java/awt": [],
            "javax/swing": [],
            "java/beans": [],
            "sun/misc": [],
            "java/lang/instrument": []
        ]
        Enumeration<JarEntry> entries = jar.entries()
        while (entries.hasMoreElements()) {
            JarEntry entry = entries.nextElement()
            if (entry.getName().endsWith(".class") || entry.getName().endsWith(".clazz")) {
                byte[] bytes = jar.getInputStream(entry).readAllBytes()
                String content = new String(bytes, "ISO-8859-1")
                patterns.keySet().each { prefix ->
                    if (content.contains(prefix)) {
                        patterns[prefix] << entry.getName()
                    }
                }
            }
        }
        jar.close()
        println "=== DESKTOP JDK API SCAN RESULTS ==="
        patterns.each { prefix, list ->
            println "Pattern '${prefix}': ${list.size()} matching files"
            list.take(10).each { println "   - ${it}" }
            if (list.size() > 10) println "   ... and ${list.size() - 10} more"
        }
    }
}

tasks.shadowJar.finalizedBy tasks.postProcessKotlincJar
tasks.postProcessKotlincJar.finalizedBy tasks.verifyClazzEntries, tasks.verifyNoJavaManagement
tasks.assemble.dependsOn tasks.verifyClazzEntries, tasks.verifyNoJavaManagement
tasks.build.dependsOn tasks.verifyClazzEntries, tasks.verifyNoJavaManagement
